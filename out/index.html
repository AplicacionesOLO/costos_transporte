<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EEF6F5;--bg2:#FFFFFF;--bg3:#F0F8F7;--card:#FFFFFF;--border:#D0EAE6;--border2:#B3DDD8;
  --text:#14201E;--text2:#4a5e5a;--text3:#7d9691;--teal:#009B8D;--teal2:#007B6E;--teal3:#00B49E;--teal-soft:#E8F7F5;
  --amber:#d97706;--amber-soft:#fef3e2;--red:#dc2626;--red-soft:#fde8e8;--green:#059669;
  --radius:8px;--radius2:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px -8px rgba(0,155,141,.15);
}
[data-theme="dark"]{
  --bg:#0d1716;--bg2:#13201e;--bg3:#101b1a;--card:#152322;--border:#234440;--border2:#2d5751;
  --text:#e6f1ef;--text2:#9fb8b3;--text3:#6a8580;--teal:#2dd4bf;--teal2:#14b8a6;--teal3:#5eead4;--teal-soft:#13302c;
  --amber:#fbbf24;--amber-soft:#2e2410;--red:#f87171;--red-soft:#2e1414;--green:#34d399;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:13px;color:var(--text)}
button{cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:34px;width:auto;display:block}
[data-theme="dark"] .logo img{background:#fff;padding:5px 8px;border-radius:6px}
.logo h1{font-size:16px;font-weight:700;color:var(--teal)}
.logo small{display:block;color:var(--text2);font-weight:500;font-size:12px}
.sp{flex:1}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--radius);padding:7px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--teal2)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn.ghost:hover{background:var(--bg3);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#filters{position:sticky;top:55px;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=date],input[type=number],select{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 9px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--teal-soft);color:var(--teal2);border:1px solid var(--border2);border-radius:99px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
[data-theme="dark"] .chip{color:var(--teal)}
.chip button{background:none;border:none;color:inherit;font-size:14px;line-height:1;padding:0 3px}
.pop{position:absolute;z-index:60;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius2);box-shadow:var(--shadow);padding:10px;width:320px;max-height:420px;display:flex;flex-direction:column;gap:8px}
.pop .list{overflow:auto;display:flex;flex-direction:column;gap:2px;max-height:290px}
.pop label.opt{display:flex;gap:8px;align-items:center;padding:3px 4px;border-radius:6px;font-size:13px;cursor:pointer}
.pop label.opt:hover{background:var(--bg3)}
.pop label.opt span.n{margin-left:auto;color:var(--text3);font-size:11px}
nav#tabs{display:flex;gap:4px;padding:12px 20px 0;flex-wrap:wrap;border-bottom:1px solid var(--border)}
nav#tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;font-weight:600;color:var(--text2)}
nav#tabs button[aria-selected=true]{color:var(--teal);border-bottom-color:var(--teal)}
nav#tabs button:hover{color:var(--text)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpi .v{white-space:nowrap;font-size:clamp(18px,1.7vw,24px);font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--text3);font-weight:600}
.kpi .s{font-size:11px;color:var(--text3)}
.hb{display:grid;grid-template-columns:minmax(80px,200px) 1fr auto;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);cursor:default}
.hb .bar{height:14px;background:var(--bg3);border-radius:4px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal3));border-radius:4px}
.hb .val{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius2);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--bg3);color:var(--text2);font-weight:700;cursor:pointer;user-select:none;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--teal-soft)}
tr.click{cursor:pointer}
td.trunc{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 2px;font-size:12px;color:var(--text2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.note{font-size:12px;color:var(--text3);margin:6px 0}
.warn{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:12.5px;margin:8px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--bg);border-radius:var(--radius2);width:min(1100px,100%);padding:18px;box-shadow:var(--shadow);position:relative}
#modal .x{position:absolute;right:12px;top:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:12.5px}
.kv div b{color:var(--text3);font-weight:600;font-size:11px;display:block;text-transform:uppercase}
svg text{fill:var(--text2);font-size:10px}
.heat td.c{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--teal-soft);color:var(--teal2)}
.tag.baja{background:var(--amber-soft);color:var(--amber)}
.tag.sin{background:var(--red-soft);color:var(--red)}
footer{padding:20px;text-align:center;color:var(--text3);font-size:12px}
#printHead{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:10px}
  header,#filters,nav#tabs,.tools,.pager,footer,#modal,.no-print,.warn,button{display:none!important}
  main{padding:0;max-width:none}
  #printHead{display:flex;align-items:center;gap:14px;border-bottom:2px solid #009B8D;padding-bottom:6px;margin-bottom:8px}
  #printHead img{height:30px;width:auto}
  #printHead h1{font-size:15px;color:#007B6E;margin:0}
  #printHead .meta{font-size:9px;color:#4a5e5a}
  .card{box-shadow:none;border:1px solid #D0EAE6;break-inside:avoid;padding:8px 10px}
  .grid.kpis{grid-template-columns:repeat(6,1fr);gap:6px}
  .kpi .v{font-size:15px}
  .grid.cols2{grid-template-columns:1fr 1fr;gap:8px}
  .tablewrap{overflow:visible!important;max-height:none!important;border:none}
  table{font-size:7.2px}
  th,td{padding:2px 3px}
  th{position:static;background:#E8F7F5!important}
  .pb{break-before:page}
}
</style>

<script>
window.__OLO_START=()=>{
'use strict';
/* ============================ DATOS ============================ */
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;  // copia limpia para compartir
const DATA=window.__OLO_DATA;
let SHARED=null;try{SHARED=JSON.parse(document.getElementById('olo-shared').textContent)}catch(e){}
const {viajes:VJ,clientes:CL,arts:AR,days:DAYS,lines:L,exps:EX,meta:META}=DATA;
const N=L.v.length;
const ORIGIN=META.origen;
const $=(s,p=document)=>p.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _nf={};
const fmtN=(v,d=0)=>{if(v==null||!isFinite(v))return '—';return (_nf[d]||(_nf[d]=new Intl.NumberFormat('es-CR',{minimumFractionDigits:d,maximumFractionDigits:d}))).format(v)};
const pct=v=>v==null||!isFinite(v)?'—':fmtN(v*100,1)+'%';

/* líneas: kg, m3, km por línea */
const KG=new Float64Array(N),M3=new Float64Array(N),KM=new Float64Array(N),Q=Float64Array.from(L.q);
const COB=new Float64Array(N),WK=new Float64Array(N),CFE=new Float64Array(N),CFP=new Float64Array(N),CF=new Float64Array(N);
const HASC=Uint8Array.from(L.v.map(v=>VJ.conCosto[v]?1:0));
const NV=VJ.id.length;
/* parámetros de costo (editables y guardados en el navegador) */
const PAR={fvol:META.factorVol||333,cprop:0};
/* Prioridad: 1) cambios guardados en ESTA copia (clave única por copia) 2) valores incluidos en el archivo 3) valores por defecto.
   La clave depende de la versión y de la copia: abrir otra copia no mezcla valores. */
const PAR_KEY='olo-transp-par:'+META.generado+':'+((SHARED&&SHARED.by)||'original');
if(SHARED&&SHARED.par){if(SHARED.par.fvol>0)PAR.fvol=+SHARED.par.fvol;if(SHARED.par.cprop>=0)PAR.cprop=+SHARED.par.cprop}
try{const sv=JSON.parse(localStorage.getItem(PAR_KEY)||'null');if(sv){if(sv.fvol>0)PAR.fvol=+sv.fvol;if(sv.cprop>=0)PAR.cprop=+sv.cprop}}catch(e){}
if(DATA.flota){PAR.cprop=+DATA.flota.costo||0;if(+DATA.flota.factor_vol>0)PAR.fvol=+DATA.flota.factor_vol}
let PROP_TOT=0,EXT_TOT=0,PROP_SIN=0;
/* Costo de flota propia POR DÍA (web/Supabase). Si existe DATA.flotaDia, se usa en lugar del monto mensual. */
const DAILY=Array.isArray(DATA.flotaDia);
const FDIA={};if(DAILY)DATA.flotaDia.forEach(d=>{FDIA[String(d.fecha).slice(0,10)]={costo:+d.costo||0,nota:d.nota||'',por:d.por||'',en:d.en||''}});
const VDAY=VJ.id.map((_,v)=>String(VJ.ini[v]||(VJ.cfFecha&&VJ.cfFecha[v])||'').slice(0,10));   // día del viaje (referencia): inicio de carga WMS
const LDAY=i=>DAYS[L.d[i]];   // día de cada línea = Fecha Carga del WMS (la misma del filtro y del gráfico Por día)
const cpropMes=()=>DAILY?Object.values(FDIA).reduce((a,d)=>a+d.costo,0):PAR.cprop;
let POOLD={},MINDIA={};
const MINV=META.minViaje!=null&&isFinite(+META.minViaje)?+META.minViaje:85000;   // ₡ mínimo por viaje de flota propia (parámetro costo_min_viaje_propio)
for(let i=0;i<N;i++){
  const a=L.a[i],c=L.c[i];
  KG[i]=Q[i]*(AR.kg[a]||0); M3[i]=Q[i]*(AR.m3[a]||0);
  const k=CL.kmRuta[c]; KM[i]=k==null?NaN:k;
}

/* Prorrateo: peso cobrable = max(kg real, m³ × factor). Peso del reparto = peso cobrable × km del cliente
   (sin km -> km promedio del viaje; viaje sin km -> km promedio global).
   Externo: costo del archivo repartido dentro del viaje. Flota propia: se ignora el costo del archivo;
   el costo ingresado se reparte entre todas las líneas de viajes propios (según participación propia del viaje). */
function computeCost(){
  const num=new Float64Array(NV),den=new Float64Array(NV),ws=new Float64Array(NV);
  let gn=0,gd=0;
  for(let i=0;i<N;i++){COB[i]=Math.max(KG[i],M3[i]*PAR.fvol);const k=KM[i];if(k===k){num[L.v[i]]+=COB[i]*k;den[L.v[i]]+=COB[i];gn+=COB[i]*k;gd+=COB[i]}}
  const glob=gd>0?gn/gd:0;
  for(let i=0;i<N;i++){const v=L.v[i],k=KM[i];const km=k===k?k:(den[v]>0?num[v]/den[v]:glob);WK[i]=COB[i]*km;ws[v]+=WK[i]}
  for(let i=0;i<N;i++){const v=L.v[i];if(!(ws[v]>0)){WK[i]=Q[i]}}
  ws.fill(0);for(let i=0;i<N;i++)ws[L.v[i]]+=WK[i];
  /* Flota propia con costo MÍNIMO por viaje (MINV, costo fijo) y TOPE del día:
     unidad = viaje × día de carga (mensual: viaje). Peso de la unidad = Σ w × participación propia.
     Mínimo de la unidad = MINV × participación propia × (peso de la unidad ÷ peso del viaje), así un viaje
     cargado en dos días suma un solo mínimo. Reparto del monto C del grupo (día o mes):
       1) proporcional a peso cobrable × km;  2) las unidades bajo su mínimo suben al mínimo y el resto
       del monto se reparte entre las demás (se repite hasta que ninguna quede bajo el mínimo);
       3) si los mínimos suman más que C, el monto C se reparte en proporción a los mínimos (el día nunca supera C). */
  const UK=new Int32Array(N).fill(-1),uKey=new Map(),uW=[],uV=[],uG=[],tW=new Float64Array(NV);
  for(let i=0;i<N;i++){const v=L.v[i],w=WK[i]*(VJ.share[v]||0);if(!(w>0))continue;
    const g=DAILY?LDAY(i):'mes',k=v+'|'+g;let u=uKey.get(k);
    if(u===undefined){u=uW.length;uKey.set(k,u);uW.push(0);uV.push(v);uG.push(g)}
    UK[i]=u;uW[u]+=w;tW[v]+=w}
  const uA=new Float64Array(uW.length),grp={};
  uW.forEach((w,u)=>{(grp[uG[u]]||(grp[uG[u]]=[])).push(u)});
  POOLD={};MINDIA={};
  Object.entries(grp).forEach(([g,us])=>{
    POOLD[g]=us.reduce((a,u)=>a+uW[u],0);
    const C=DAILY?(FDIA[g]?FDIA[g].costo:0):PAR.cprop;
    const fl=u=>MINV*(VJ.share[uV[u]]||0)*(tW[uV[u]]>0?uW[u]/tW[uV[u]]:0);
    const info={viajes:new Set(us.map(u=>uV[u])).size,alMin:0,insuf:false,sumMin:us.reduce((a,u)=>a+fl(u),0),costo:C};
    MINDIA[g]=info;if(!(C>0))return;
    if(info.sumMin>=C&&info.sumMin>0){us.forEach(u=>uA[u]=C*fl(u)/info.sumMin);info.insuf=true;info.alMin=info.viajes;return}
    const fijo=new Set();let ok=false;
    while(!ok){ok=true;const libres=us.filter(u=>!fijo.has(u));
      const resto=C-[...fijo].reduce((a,u)=>a+fl(u),0),wl=libres.reduce((a,u)=>a+uW[u],0);
      fijo.forEach(u=>uA[u]=fl(u));
      libres.forEach(u=>{uA[u]=wl>0?resto*uW[u]/wl:0;if(uA[u]<fl(u)-1e-6){fijo.add(u);ok=false}})}
    info.alMin=new Set([...fijo].map(u=>uV[u])).size});
  EXT_TOT=0;PROP_TOT=0;PROP_SIN=0;
  for(let i=0;i<N;i++){const v=L.v[i],w=WK[i]*(VJ.share[v]||0),u=UK[i];
    CFE[i]=ws[v]>0?WK[i]/ws[v]*(VJ.costoExt[v]||0):0;
    CFP[i]=u>=0&&uW[u]>0?uA[u]*w/uW[u]:0;
    CF[i]=CFE[i]+CFP[i];EXT_TOT+=CFE[i];PROP_TOT+=CFP[i]}
  if(DAILY)Object.entries(FDIA).forEach(([d,x])=>{if(!(POOLD[d]>0))PROP_SIN+=x.costo});   // días con costo pero sin viajes propios
}
computeCost();

  for(let i=0;i<N;i++){const s=String(fn(i));let k=map.get(s);if(k===undefined){k=cats.length;map.set(s,k);cats.push(s)}arr[i]=k}
  let order=cats.map((_,i)=>i);
  if(opts.cmp)order.sort((a,b)=>opts.cmp(cats[a],cats[b]));
  else order.sort((a,b)=>cats[a].localeCompare(cats[b],'es',{numeric:true}));
  DIMS[id]={id,label,cats,arr,order,filter:opts.filter!==false,pivot:opts.pivot!==false,...opts};

}

/* ============================ FILTROS ============================ */
const F={from:'',to:'',search:'',sets:{}};
let FILT=new Int32Array(0);
const searchCache={};
function computeSearchMask(){
  const q=F.search.trim().toLowerCase();if(!q)return null;
  const masks={};
  ['cliente','articulo','viaje'].forEach(d=>{const D=DIMS[d];masks[d]=D.cats.map(c=>c.toLowerCase().includes(q))});
  return masks;
}
function applyFilters(){
  const sm=computeSearchMask();
  // comparación directa de fechas YYYY-MM-DD (antes: findIndex devolvía -1 si "Desde" caía después del último día con despacho y no filtraba nada)
  const dayOk=DAYS.map(d=>(!F.from||d>=F.from)&&(!F.to||d<=F.to));
  const active=Object.entries(F.sets).filter(([,s])=>s.size>0).map(([id,s])=>[DIMS[id].arr,s]);
  const out=[];
  const dC=DIMS.cliente.arr,dA=DIMS.articulo.arr,dV=DIMS.viaje.arr;
  for(let i=0;i<N;i++){
    if(!dayOk[L.d[i]])continue;
    if(sm&&!(sm.cliente[dC[i]]||sm.articulo[dA[i]]||sm.viaje[dV[i]]))continue;
    let ok=true;for(let j=0;j<active.length;j++){if(!active[j][1].has(active[j][0][i])){ok=false;break}}
    if(ok)out.push(i);
  }
  FILT=Int32Array.from(out);
  $('#count').textContent=fmtN(FILT.length)+' de '+fmtN(N)+' líneas';
}

/* ============================ AGREGACIÓN ============================ */
function newAgg(label,key,sets){
  const g={label,key,kg:0,m3:0,u:0,lines:0,kmkg:0,kmm3:0,kmMax:-1,cf:0,cfE:0,cfP:0,cob:0,cobC:0,wk:0,wkC:0,kgC:0,m3C:0,kmkgC:0,volLines:0};
  ['viajes','clientes','exps','arts'].forEach(s=>{if(!sets||sets.includes(s))g[s]=new Set()});
  return g;
}
function addTo(g,i){
  g.kg+=KG[i];g.m3+=M3[i];g.u+=Q[i];g.lines++;g.cf+=CF[i];g.cfE+=CFE[i];g.cfP+=CFP[i];g.cob+=COB[i];g.wk+=WK[i];
  if(M3[i]*PAR.fvol>KG[i])g.volLines++;
  if(HASC[i]){g.kgC+=KG[i];g.m3C+=M3[i];g.cobC+=COB[i];g.wkC+=WK[i];const k0=KM[i];if(k0===k0)g.kmkgC+=KG[i]*k0}
  if(g.viajes)g.viajes.add(L.v[i]);if(g.clientes)g.clientes.add(L.c[i]);if(g.exps)g.exps.add(L.e[i]);if(g.arts)g.arts.add(L.a[i]);
  const km=KM[i];if(km===km){g.kmkg+=KG[i]*km;g.kmm3+=M3[i]*km;if(km>g.kmMax)g.kmMax=km}
}
function groupBy(dimId,idx,sets){
  const D=DIMS[dimId],g=new Array(D.cats.length);
  for(let n=0;n<idx.length;n++){const i=idx[n],k=D.arr[i];let o=g[k];if(!o)o=g[k]=newAgg(D.cats[k],k,sets);addTo(o,i)}
  return g.filter(Boolean);
}
function total(idx){const g=newAgg('Total',0);for(let n=0;n<idx.length;n++)addTo(g,idx[n]);return g}
function subset(dimId,key,idx){const a=DIMS[dimId].arr;const o=[];for(let n=0;n<idx.length;n++)if(a[idx[n]]===key)o.push(idx[n]);return Int32Array.from(o)}
function enrich(g){METRICS.forEach(m=>{g['m_'+m.id]=m.get(g)});return g}

function kpi(l,v,s=''){return `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`}
function hbars(items,fmt,max){
  if(!items.length)return '<div class="note">Sin datos con los filtros actuales.</div>';
  const m=max||Math.max(...items.map(x=>x.value),1e-9);
  return items.map(x=>`<div class="hb"><span class="lab" title="${esc(x.label)}">${esc(x.label)}</span><span class="bar"><i style="width:${Math.max(1,Math.round(x.value/m*100))}%"></i></span><span class="val">${fmt(x.value)}</span></div>`).join('');
}
function vbars(items,fmt,h=190){
  if(!items.length)return '<div class="note">Sin datos.</div>';
  const W=Math.max(520,items.length*26),pad=28,mx=Math.max(...items.map(x=>x.value),1e-9),bw=(W-pad)/items.length;
  const bars=items.map((x,i)=>{const bh=(h-40)*x.value/mx;const lx=pad+i*bw;return `<rect x="${lx+2}" y="${h-22-bh}" width="${Math.max(2,bw-4)}" height="${bh}" fill="var(--teal)" rx="2"><title>${esc(x.label)}: ${fmt(x.value)}</title></rect>`+(items.length<=31||i%Math.ceil(items.length/31)===0?`<text x="${lx+bw/2}" y="${h-8}" text-anchor="middle">${esc(x.short||x.label)}</text>`:'')}).join('');
  return `<div><svg viewBox="0 0 ${W} ${h}" width="100%" role="img"><text x="0" y="10">${fmt(mx)}</text><line x1="${pad}" x2="${W}" y1="${h-22}" y2="${h-22}" stroke="var(--border2)"/>${bars}</svg></div>`;
}
function scatter(pts,xl,yl,h=260){

  const W=640,pl=48,pb=28,pt=8,pr=10,mx=Math.max(...pts.map(p=>p.x),1),my=Math.max(...pts.map(p=>p.y),1);

function downloadCSV(name,head,rows){
  const q=v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='\ufeff'+[head.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
/* tabla ordenable/paginada */
const TS={};
function table(host,id,cols,rows,opt={}){
  const st=TS[id]||(TS[id]={sort:opt.sort||null,dir:-1,page:0});
  const per=opt.per||50;
  if(st.sort){const c=cols.find(c=>c.k===st.sort);if(c){rows=rows.slice().sort((a,b)=>{let x=c.get(a),y=c.get(b);const nx=x==null||x!==x,ny=y==null||y!==y;if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;return (typeof x==='string'?x.localeCompare(y,'es',{numeric:true}):x-y)*st.dir})}}
  const pages=Math.max(1,Math.ceil(rows.length/per));if(st.page>=pages)st.page=pages-1;
  const sl=rows.slice(st.page*per,(st.page+1)*per);
  const head=cols.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}" aria-sort="${st.sort===c.k?(st.dir>0?'ascending':'descending'):'none'}">${esc(c.label)}${st.sort===c.k?(st.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body=sl.map((r,ri)=>`<tr class="${opt.onRow?'click':''}" data-ri="${ri}">${cols.map(c=>{const v=c.get(r);const t=c.fmt?c.fmt(v,r):esc(v==null?'':v);return `<td class="${c.num?'num':''} ${c.trunc?'trunc':''}">${c.html?c.html(v,r):t}</td>`}).join('')}</tr>`).join('');
  host.innerHTML=`<div class="tablewrap" style="max-height:${opt.maxh||'70vh'}"><table><thead><tr>${head}</tr></thead><tbody>${body||'<tr><td colspan="99">Sin datos con los filtros actuales.</td></tr>'}</tbody></table></div>
  <div class="pager"><span>${fmtN(rows.length)} filas</span><span class="sp"></span><button class="btn ghost sm" data-a="exp">Exportar CSV</button><button class="btn ghost sm" data-a="prev" ${st.page<=0?'disabled':''}>◀</button><span>pág. ${st.page+1} / ${pages}</span><button class="btn ghost sm" data-a="next" ${st.page>=pages-1?'disabled':''}>▶</button></div>`;
  host.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=cols.find(c=>c.k===k).num?-1:1}st.page=0;table(host,id,cols,rows,opt)});
  host.querySelectorAll('tbody tr.click').forEach(tr=>tr.onclick=()=>opt.onRow(sl[+tr.dataset.ri]));

addView({id:'red',title:'Rutas y costos',render(host){

  <details class="card" id="metodo" style="margin-top:12px" ${TR.met?'open':''}><summary style="cursor:pointer;font-weight:700;color:var(--teal)">¿Cómo se calcula y distribuye el costo? (referencia)</summary>
   <div style="margin-top:10px;font-size:13px;line-height:1.6">
   <p><b>1. Costo de cada viaje.</b> Se toma del <i>${esc(META.fuenteCosto)}</i> y se cruza por <b>Viaje WMS = N° viaje</b>. Si un viaje tiene varias filas (zonas o guías) se suman.
     <br>• <b>Externo:</b> se usa el <i>Costo flete ₡</i> del archivo.
     <br>• <b>Flota propia:</b> el costo del archivo <b>no se usa</b>. ${DAILY?`Se usa el costo <b>por día</b> ingresado en la pestaña <i>Flota propia</i> (mes ₡ ${fmtN(cpropMes(),0)}). El costo de cada día se reparte solo entre las líneas de viajes propios con <b>Fecha Carga (WMS)</b> de ese día. Si un viaje se cargó en dos días, cada parte recibe costo de su día.
       <br>• <b>Mínimo por viaje propio: ₡ ${fmtN(MINV,0)}</b> (costo fijo de mano de obra, camión, etc.). Si el reparto le da menos a un viaje, sube a ₡ ${fmtN(MINV,0)} y la diferencia se descuenta de los demás viajes del día. <b>El total del día nunca supera el monto ingresado</b>: si los mínimos no caben (viajes × ₡ ${fmtN(MINV,0)} &gt; costo del día), el monto del día se reparte en proporción al mínimo de cada viaje (partes iguales entre viajes 100% propios). En viajes mixtos el mínimo se aplica solo a la parte propia (₡ ${fmtN(MINV,0)} × participación propia).`:`Se reparte el monto ingresado en <i>Costo flota propia ₡ (mes)</i> (hoy ₡ ${fmtN(PAR.cprop,0)}), con mínimo de ₡ ${fmtN(MINV,0)} por viaje propio sin superar el monto del mes.`}
     <br>• Viaje mixto: participación propia = costo propio del archivo ÷ costo total del viaje (si el costo es 0, por número de filas).</p>
   <p><b>2. Peso cobrable de cada línea</b> (artículo × cliente × viaje):
     <br><code>peso cobrable = máx( peso real kg , volumen m³ × ${fmtN(PAR.fvol)} )</code>
     <br>peso real = unidades despachadas × peso unitario · volumen = unidades × volumen unitario (maestro completado). El factor ${fmtN(PAR.fvol)} kg/m³ se edita en la barra de filtros. Así un artículo liviano pero voluminoso paga por el espacio que ocupa.</p>
   <p><b>3. Distancia de la línea</b> = km de ruta del cliente = km en línea recta desde el CD (9.99687, −84.26074) × ${META.factor}.
     <br>Cliente sin coordenadas → km estimado por el cantón de su código. Si aún no hay km → km promedio ponderado del viaje (o el promedio global).</p>
   <p><b>4. Peso de reparto</b> de la línea: <code>w = peso cobrable × km</code> (kg·km cobrables).</p>
   <p><b>5. Costo asignado a la línea</b>
     <br>• Externo: <code>costo línea = costo externo del viaje × w ÷ Σ w de las líneas del viaje</code>
     <br>• Flota propia: ${DAILY?'<code>costo viaje = máx( ₡ '+fmtN(MINV,0)+' , costo del DÍA × Σw del viaje ÷ Σw de los viajes propios del día )</code>, reajustando los demás para que la suma del día = costo del día. <code>costo línea = costo viaje × w ÷ Σw del viaje</code> (w con participación propia)':'<code>costo viaje = máx( ₡ '+fmtN(MINV,0)+' , costo del mes × Σw del viaje ÷ Σw de los viajes propios )</code>, reajustando los demás para que la suma = costo del mes. <code>costo línea = costo viaje × w ÷ Σw del viaje</code>'}
     <br>• Costo total = externo + flota propia. Si un viaje no tiene peso ni volumen, se reparte por unidades.</p>
   <p><b>6. Agregación.</b> Zona, cliente, viaje, artículo o BDF = suma de sus líneas, por eso todos los niveles cuadran con el total. <code>₡/kg cobrable = costo ÷ peso cobrable</code> (solo viajes con costo); <code>₡/ton·km = costo ÷ (kg real × km ÷ 1000)</code>.</p>
   <p><b>Ejemplo.</b> Viaje externo de ₡ 100 000 con dos clientes: A lleva 200 kg y 0,3 m³ a 20 km → cobrable máx(200, 0,3×${fmtN(PAR.fvol)}=${fmtN(0.3*PAR.fvol)}) = ${fmtN(Math.max(200,0.3*PAR.fvol))} kg → w = ${fmtN(Math.max(200,0.3*PAR.fvol)*20)}. B lleva 50 kg y 1,2 m³ a 60 km → cobrable ${fmtN(Math.max(50,1.2*PAR.fvol))} kg → w = ${fmtN(Math.max(50,1.2*PAR.fvol)*60)}. A paga ₡ ${fmtN(100000*Math.max(200,0.3*PAR.fvol)*20/(Math.max(200,0.3*PAR.fvol)*20+Math.max(50,1.2*PAR.fvol)*60))} y B ₡ ${fmtN(100000*Math.max(50,1.2*PAR.fvol)*60/(Math.max(200,0.3*PAR.fvol)*20+Math.max(50,1.2*PAR.fvol)*60))}.</p>
   <p style="color:var(--text3)">Supuestos: el factor ${META.factor} y el factor ${fmtN(PAR.fvol)} kg/m³ no son mediciones; los pesos/volúmenes con confianza baja son estimados por familia. La secuencia real de entrega no se conoce.</p>
   </div></details>

  {k:'cf',l:'Costo total ₡',f:g=>g.cf,d:0,b:1},{k:'pc',l:'% del costo',f:(g,t)=>t.cf>0?g.cf/t.cf:NaN,pct:1},

  {k:'ckgc',l:'₡/kg cobrable',f:g=>g.cobC>0?g.cf/g.cobC:NaN,d:2},{k:'ckg',l:'₡/kg real',f:g=>g.kgC>0?g.cf/g.kgC:NaN,d:2},
  {k:'ctkm',l:'₡/ton·km',f:g=>g.kmkgC>0?g.cf/(g.kmkgC/1000):NaN,d:0},{k:'cm3',l:'₡/m³',f:g=>g.m3C>0?g.cf/g.m3C:NaN,d:0},
  {k:'cu',l:'₡/unidad',f:g=>g.u>0?g.cf/g.u:NaN,d:2},{k:'ccl',l:'₡/cliente',f:g=>g.clientes.size?g.cf/g.clientes.size:NaN,d:0}];
/* Interpretación: ₡/kg cobrable = km promedio × tarifa (₡ por kg cobrable·km). Así se separa
   "va más lejos" de "viaja en viajes más caros por kg·km" (poca carga en el viaje, externo vs propia). */
function interpBDF(rows,T){
  const m=g=>({cf:g.cf,pc:T.cf>0?g.cf/T.cf:0,pcob:T.cob>0?g.cob/T.cob:0,pkg:T.kg>0?g.kg/T.kg:0,
    ckg:g.cobC>0?g.cf/g.cobC:NaN,km:g.cobC>0?g.wkC/g.cobC:NaN,tar:g.wkC>0?g.cf/g.wkC:NaN,
    vol:g.lines?g.volLines/g.lines:NaN,ext:g.cf>0?g.cfE/g.cf:NaN,cl:g.clientes.size,cob:g.cob,kg:g.kg,
    ccl:g.clientes.size?g.cf/g.clientes.size:NaN,upl:g.lines?g.u/g.lines:NaN});
  const t=m(T);const dif=(a,b)=>b>0&&a===a?(a/b-1):NaN;
  const sg=(x,mas,menos)=>!(x===x)?'':(x>=0?mas:menos);
  const pp=x=>x===x?(x>=0?'+':'')+fmtN(x*100,0)+'%':'—';
  const why=(g,M)=>{const r=[];const dk=dif(M.km,t.km),dt=dif(M.tar,t.tar),dv=(M.vol-t.vol);
    const main=Math.abs(Math.log(1+(dk||0)))>=Math.abs(Math.log(1+(dt||0)))?'km':'tar';
    r.push(`sus clientes están en promedio a <b>${fmtN(M.km,0)} km</b> (${pp(dk)} vs promedio ${fmtN(t.km,0)} km)`);
    r.push(`viaja en viajes con tarifa de <b>₡ ${fmtN(M.tar,3)} por kg·km</b> (${pp(dt)} vs ₡ ${fmtN(t.tar,3)})${dt>0.1?(M.ext>t.ext+0.05?`: más de su costo va en transporte externo (${fmtN(M.ext*100,0)}% vs ${fmtN(t.ext*100,0)}%), que cobra más por kg·km`:': va en viajes con menos carga total, donde el costo fijo del viaje se reparte entre menos kilos'):dt<-0.1?(M.ext<t.ext-0.05?`: viaja más en flota propia (externo ${fmtN(M.ext*100,0)}% vs ${fmtN(t.ext*100,0)}%)`:': va en viajes más llenos, donde el costo del viaje se diluye entre más kilos'):''}`);
    r.push(`${fmtN(M.vol*100,0)}% de sus líneas cobra por volumen (promedio ${fmtN(t.vol*100,0)}%)${dv>0.08?': son artículos voluminosos y pagan por el espacio que ocupan':dv<-0.08?': son artículos densos, pagan por peso real':''}`);
    return {txt:r,main};};
  const get=c=>rows.find(g=>g.label.startsWith('('+c+')'));
  const B=get('B'),D=get('D'),Fb=get('F');
  let html='';
  if(B&&D&&Fb){const mb=m(B),md=m(D),mf=m(Fb);
    const ord=[[B,mb],[D,md],[Fb,mf]].sort((a,b)=>b[1].cf-a[1].cf);
    html+=`<p><b>¿Por qué el costo total difiere entre B, D y F?</b> El costo total de cada categoría sale de cuánto <b>peso cobrable</b> mueve, a qué <b>distancia</b> y en qué <b>viajes</b>. ${ord.map(([g,M])=>`<b>${esc(g.label)}</b> ₡ ${fmtN(M.cf,0)} (${fmtN(M.pc*100,1)}% del costo, ${fmtN(M.pcob*100,1)}% del peso cobrable)`).join(' › ')}.
      ${mb.cf<md.cf&&mb.cf<mf.cf?`El Triple Básico gasta menos en total <b>porque mueve mucho menos carga</b>: ${fmtN(mb.cob/1000,1)} t cobrables contra ${fmtN(md.cob/1000,1)} t del Doble Básico y ${fmtN(mf.cob/1000,1)} t del Básico (son ${fmtN(B.arts.size)} artículos, de alta rotación pero en general pequeños). Gastar menos en total no significa ser más barato por kilo.`:''}</p>
      <p><b>Costo por kg cobrable:</b> ${[[B,mb],[D,md],[Fb,mf]].map(([g,M])=>`${esc(g.label.replace(/^\(.\)\s*/,''))} ₡ ${fmtN(M.ckg,2)}`).join(' · ')} (promedio ₡ ${fmtN(t.ckg,2)}). Se explica como <code>₡/kg cobrable = km promedio × tarifa ₡ por kg·km</code>:</p><ul style="margin:4px 0 8px 18px">
      ${[[B,mb],[D,md],[Fb,mf]].map(([g,M])=>{const w=why(g,M);return `<li><b>${esc(g.label)}</b> (₡ ${fmtN(M.ckg,2)}/kg, ${sg(dif(M.ckg,t.ckg),'más caro','más barato')} que el promedio ${pp(dif(M.ckg,t.ckg))}; pesa más ${w.main==='km'?'la distancia':'la tarifa del viaje'}): ${w.txt.join('; ')}.</li>`}).join('')}</ul>`;}
  const valid=rows.filter(g=>g.cobC>0&&g.cob>=500&&g.label!=='No está en BDF');
  if(valid.length>2){const sorted=valid.map(g=>[g,m(g)]).sort((a,b)=>b[1].ckg-a[1].ckg);const hi=sorted[0],lo=sorted[sorted.length-1];
    html+=`<p><b>Extremos (categorías con ≥ 500 kg cobrables):</b> la más cara por kg es <b>${esc(hi[0].label)}</b> (₡ ${fmtN(hi[1].ckg,2)}; ${why(hi[0],hi[1]).txt[why(hi[0],hi[1]).main==='km'?0:1]}) y la más barata <b>${esc(lo[0].label)}</b> (₡ ${fmtN(lo[1].ckg,2)}; ${why(lo[0],lo[1]).txt[why(lo[0],lo[1]).main==='km'?0:1]}).</p>`;}
  const nb=rows.find(g=>g.label==='No está en BDF');
  if(nb&&nb.cobC>0){const M=m(nb);html+=`<p><b>Artículos fuera del BDF:</b> ₡ ${fmtN(M.ckg,2)}/kg porque son pocos kilos (${fmtN(nb.kg,0)} kg) en ${fmtN(nb.viajes.size)} viajes; cualquier costo asignado pesa mucho por kilo. Conviene revisar si deben estar en el BDF.</p>`;}
  const dec=rows.map(g=>[g,m(g)]);
  return `<div class="card pb" style="margin-top:14px;break-inside:auto"><h3>Interpretación de la distribución del costo</h3><div style="font-size:12.5px;line-height:1.55">${html||'<p>Sin datos suficientes con los filtros actuales.</p>'}</div>
   <div class="tablewrap" style="max-height:none;margin-top:6px"><table><thead><tr><th>BDF</th><th class="num">% del costo</th><th class="num">% peso cobrable</th><th class="num">% peso real</th><th class="num">Km prom. (cobrable)</th><th class="num">Tarifa ₡/kg·km</th><th class="num">₡/kg cobrable</th><th class="num">% líneas por volumen</th><th class="num">% costo externo</th><th class="num">Clientes</th><th class="num">₡/cliente</th></tr></thead><tbody>
   ${dec.map(([g,M])=>`<tr><td>${esc(g.label)}</td><td class="num">${pct(M.pc)}</td><td class="num">${pct(M.pcob)}</td><td class="num">${pct(M.pkg)}</td><td class="num">${fmtN(M.km,1)}</td><td class="num">${fmtN(M.tar,3)}</td><td class="num"><b>${fmtN(M.ckg,2)}</b></td><td class="num">${pct(M.vol)}</td><td class="num">${pct(M.ext)}</td><td class="num">${fmtN(M.cl)}</td><td class="num">${fmtN(M.ccl,0)}</td></tr>`).join('')}
   <tr style="font-weight:700;background:var(--bg3)"><td>Total</td><td class="num">100%</td><td class="num">100%</td><td class="num">100%</td><td class="num">${fmtN(t.km,1)}</td><td class="num">${fmtN(t.tar,3)}</td><td class="num">${fmtN(t.ckg,2)}</td><td class="num">${pct(t.vol)}</td><td class="num">${pct(t.ext)}</td><td class="num">${fmtN(t.cl)}</td><td class="num">${fmtN(t.ccl,0)}</td></tr></tbody></table></div>
   <h3 style="margin-top:12px">Supuestos de la distribución</h3><ul style="margin:0 0 0 18px;font-size:12px;line-height:1.55">
    <li><b>Peso cobrable</b> = máx(peso real, m³ × ${fmtN(PAR.fvol)} kg/m³). El factor ${fmtN(PAR.fvol)} es un estándar de transporte terrestre, no una medición propia; con un factor menor, los artículos voluminosos pagan menos.</li>
    <li><b>Distancia</b> = km en línea recta desde el CD × ${META.factor} hasta el cliente (ida). No se conoce la secuencia real de entrega; un cliente al final de la ruta y otro en el camino pagan según su propia distancia.</li>
    <li><b>Tarifa del viaje</b> (₡ por kg·km) = costo del viaje ÷ Σ(peso cobrable × km) de sus líneas. Viajes con poca carga o externos más caros elevan la tarifa de todo lo que llevan.</li>
    <li><b>Flota propia</b>: el costo del archivo no se usa; ${DAILY?`el costo ingresado por día (mes ₡ ${fmtN(cpropMes(),0)}) se reparte entre los viajes propios de cada día, con mínimo de ₡ ${fmtN(MINV,0)} por viaje y sin superar el monto del día; un día caro encarece lo que viajó ese día y los viajes chicos cargan al menos el costo fijo.`:`el costo ingresado (₡ ${fmtN(PAR.cprop,0)}) se reparte en el mes entre todos los viajes propios con una sola tarifa.`} Si está en 0, las categorías que viajan más en flota propia se ven artificialmente baratas.</li>
    <li><b>Viajes sin costo</b> en el Resumen de rutas no reciben costo; sus artículos se ven más baratos (no entran en ₡/kg cobrable).</li>
    <li><b>Pesos y volúmenes</b> con confianza baja (estimados por familia o similitud) y clientes con zona/km estimados por cantón pueden mover el reparto entre categorías.</li>
    <li><b>Clientes</b> = clientes distintos con despacho en la categoría; un cliente compra de varias categorías, por eso la suma por categoría supera el total.</li></ul></div>`;
}
addView({id:'bdf',title:'Resumen BDF',render(host){
  // todas las categorías: se aplican los demás filtros, pero no los de BDF
  const saved={bdf:F.sets.bdf,bdfGrupo:F.sets.bdfGrupo};delete F.sets.bdf;delete F.sets.bdfGrupo;applyFilters();const IDX=FILT;
  if(saved.bdf)F.sets.bdf=saved.bdf;if(saved.bdfGrupo)F.sets.bdfGrupo=saved.bdfGrupo;applyFilters();
  const withKm=g=>{g.lk=0;return g};
  const agg=(dim)=>{const D=DIMS[dim],gs=new Map();for(let n=0;n<IDX.length;n++){const i=IDX[n],k=D.arr[i];let g=gs.get(k);if(!g){g=withKm(newAgg(D.cats[k],k));gs.set(k,g)}addTo(g,i);if(KM[i]===KM[i])g.lk++}
    return [...gs.values()].sort((a,b)=>D.order.indexOf(a.key)-D.order.indexOf(b.key))};
  const T=withKm(newAgg('Total',0));for(let n=0;n<IDX.length;n++){addTo(T,IDX[n]);if(KM[IDX[n]]===KM[IDX[n]])T.lk++}
  const rows=agg('bdf'),grp=agg('bdfGrupo');

  const tbl=(id,title,list)=>`<div class="card" style="margin-top:14px"><h3>${esc(title)}<span class="sp"></span><button class="btn ghost sm" data-csv="${id}">Exportar CSV</button></h3>
    <div class="tablewrap" style="max-height:none"><table><thead><tr><th>${id==='g'?'Grupo BDF':'BDF'}</th>${BDF_COLS.map(c=>`<th class="num">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>
    ${list.map(g=>`<tr class="click" data-d="${id==='g'?'bdfGrupo':'bdf'}" data-k="${g.key}" title="Clic: ver detalle"><td style="font-weight:600">${esc(g.label)}</td>${BDF_COLS.map(c=>`<td class="num" ${c.b?'style="font-weight:700"':''}>${fv(c,g)}</td>`).join('')}</tr>`).join('')}
    <tr style="font-weight:700;border-top:2px solid var(--border2);background:var(--bg3)"><td>Total</td>${BDF_COLS.map(c=>`<td class="num">${fv(c,T)}</td>`).join('')}</tr></tbody></table></div></div>`;
  const nOtros=Object.entries(F.sets).filter(([id,st])=>st.size&&id!=='bdf'&&id!=='bdfGrupo').length+(F.from||F.to?1:0)+(F.search?1:0);
  const filtTxt=[F.from||F.to?`Fechas ${F.from||DAYS[0]} a ${F.to||DAYS[DAYS.length-1]}`:'',F.search?`Búsqueda "${F.search}"`:'',
    ...Object.entries(F.sets).filter(([id,st])=>st.size&&id!=='bdf'&&id!=='bdfGrupo').map(([id,st])=>DIMS[id].label+': '+[...st].slice(0,4).map(k=>DIMS[id].cats[k]).join(', ')+(st.size>4?' +'+(st.size-4):''))].filter(Boolean).join(' · ')||'Sin filtros (todo el período)';
  const logo=(document.querySelector('.logo img')||{}).src||'';
  host.innerHTML=`<div id="printHead"><img src="${logo}" alt="OLO"><div><h1>Resumen de transporte por BDF · Cofersa</h1>
     <div class="meta">Período ${DAYS[0]} a ${DAYS[DAYS.length-1]} · ${esc(filtTxt)} · Costo flota propia ₡ ${fmtN(cpropMes(),0)}${DAILY?' (por día)':''} · Factor volumétrico ${fmtN(PAR.fvol)} kg/m³ · Distancia = línea recta × ${META.factor} · Generado ${new Date().toLocaleString('es-CR')}</div></div></div>
   <div class="tools no-print" style="justify-content:flex-end"><button class="btn" id="bdfPdf">Exportar PDF</button></div>
   <div class="note">Todas las categorías del BDF (${esc('BDF al 6 de Noviembre.xlsx')}). Esta vista ignora el filtro de BDF para mostrar todas; ${nOtros?'sí aplica los otros '+nOtros+' filtros activos':'sin otros filtros activos'}. Costo distribuido por peso cobrable × km; flota propia ₡ ${fmtN(cpropMes(),0)}${DAILY?' (ingresada por día)':''}.</div>
   <div class="grid kpis">${kpi('Costo total','₡ '+fmtN(T.cf,0),'ext. '+fmtN(T.cfE,0)+' · propia '+fmtN(T.cfP,0))}${kpi('Peso',fmtN(T.kg/1000,1)+' t','cobrable '+fmtN(T.cob/1000,1)+' t')}${kpi('₡ / kg cobrable','₡ '+fmtN(T.cobC>0?T.cf/T.cobC:NaN,2))}${kpi('Clientes',fmtN(T.clientes.size),'distintos en el período')}${kpi('Categorías con despacho',fmtN(rows.filter(r=>r.label!=='No está en BDF').length))}${kpi('Artículos',fmtN(T.arts.size),'en BDF '+fmtN(rows.filter(r=>r.label!=='No está en BDF').reduce((a,r)=>a+r.arts.size,0)))}</div>
   <div class="grid cols2" style="margin-top:14px"><div class="card"><h3>Costo total por BDF (₡)</h3>${hbars(rows.map(g=>({label:g.label,value:g.cf})),v=>'₡ '+fmtN(v,0))}</div>
    <div class="card"><h3>₡ / kg cobrable por BDF</h3>${hbars(rows.filter(g=>g.cobC>0).map(g=>({label:g.label,value:g.cf/g.cobC})),v=>'₡ '+fmtN(v,2))}</div>

  host.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.d,+tr.dataset.k));
  $('#bdfPdf').onclick=()=>{const t0=document.title;const d=new Date(),pd=n=>String(n).padStart(2,'0');
    document.title=`OLO-Resumen-BDF-transporte_${d.getFullYear()}${pd(d.getMonth()+1)}${pd(d.getDate())}`; // nombre sugerido del PDF
    const done=()=>{document.title=t0;window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);window.print()};
  host.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>{const list=b.dataset.csv==='g'?grp:rows;
    downloadCSV('resumen-bdf-'+(b.dataset.csv==='g'?'grupos':'categorias'),[b.dataset.csv==='g'?'Grupo BDF':'BDF',...BDF_COLS.map(c=>c.l)],[...list,T].map(g=>[g.label,...BDF_COLS.map(c=>{const v=c.f(g,T);return v===v&&v!=null?Math.round(v*1e4)/1e4:''})]))});
}});

addView({id:'cruce',title:'Cruce / Pivote',render(host){
  const dopts=(sel,none)=>(none?`<option value="">— ninguna —</option>`:'')+DIM_ORDER.filter(d=>DIMS[d].pivot).map(d=>`<option value="${d}" ${sel===d?'selected':''}>${esc(DIMS[d].label)}</option>`).join('');

   <div class="field"><label>Filas</label><select id="pr">${dopts(P.row)}</select></div>
   <div class="field"><label>Columnas</label><select id="pc">${dopts(P.col,true)}</select></div>
   <div class="field"><label>Métrica</label><select id="pm">${METRICS.filter(m=>!m.nonadd||true).map(m=>`<option value="${m.id}" ${P.metric===m.id?'selected':''}>${esc(m.label)}</option>`).join('')}</select></div>

   <div class="field"><label>Máx. columnas</label><input type="number" id="pk" min="2" max="60" value="${P.topC}" style="width:80px"></div>
   <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ph" ${P.heat?'checked':''}> Mapa de calor</label>
   <button class="btn sm" id="px">Exportar CSV</button></div><div class="note">Cruza cualquier par de dimensiones (cliente, ruta, artículo, distancia, día, placa…) con la métrica elegida. Respeta los filtros globales.</div><div id="pv"></div>`;
  const go=()=>{
    P.row=$('#pr').value;P.col=$('#pc').value;P.metric=$('#pm').value;P.topR=+$('#pn').value||25;P.topC=+$('#pk').value||10;P.heat=$('#ph').checked;

    const cells=new Map(),rowT=new Map(),colT=new Map();
    for(let n=0;n<FILT.length;n++){const i=FILT[n],r=R.arr[i],c=C?C.arr[i]:0;
      const kc=r*100000+c;let g=cells.get(kc);if(!g){g=newAgg('',kc,sets);cells.set(kc,g)}addTo(g,i);
      let a=rowT.get(r);if(!a){a=newAgg('',r,sets);rowT.set(r,a)}addTo(a,i);
      if(C){let b=colT.get(c);if(!b){b=newAgg('',c,sets);colT.set(c,b)}addTo(b,i)}}
    const val=g=>g?m.get(g):NaN;
    let rkeys=[...rowT.keys()].sort((a,b)=>(val(rowT.get(b))||0)-(val(rowT.get(a))||0)).slice(0,P.topR);
    let ckeys=C?[...colT.keys()].sort((a,b)=>(val(colT.get(b))||0)-(val(colT.get(a))||0)).slice(0,P.topC):[0];
    if(C&&(P.col==='rangokm'||P.col==='dia'||P.col==='dsem'))ckeys.sort((a,b)=>C.order.indexOf(a)-C.order.indexOf(b));
    let mx=0;rkeys.forEach(r=>ckeys.forEach(c=>{const v=val(cells.get(r*100000+c));if(v>mx)mx=v}));
    const head=`<tr><th>${esc(R.label)}</th>${C?ckeys.map(c=>`<th class="num">${esc(C.cats[c])}</th>`).join(''):''}<th class="num">${C?'Total':esc(m.label)}</th></tr>`;
    const body=rkeys.map(r=>`<tr><td title="${esc(R.cats[r])}" style="max-width:340px;overflow:hidden;text-overflow:ellipsis">${esc(R.cats[r])}</td>${C?ckeys.map(c=>{const v=val(cells.get(r*100000+c));const a=P.heat&&v>0&&mx>0?(v/mx):0;return `<td class="c" style="${a?`background:rgba(0,155,141,${(0.08+0.62*a).toFixed(2)})`:''}">${v>0||m.nonadd?m.fmt(v):''}</td>`}).join(''):''}<td class="c"><b>${m.fmt(val(rowT.get(r)))}</b></td></tr>`).join('');

  const fechas=out.map(x=>(x.fecha_carga||x.fecha||'').slice(0,10)).filter(Boolean).sort();
  return {file,tipo,hoja:sn,rows:out,total:rows.length,omit,desde:fechas[0],hasta:fechas[fechas.length-1],
    dias:new Set(fechas).size,viajes:new Set(out.map(x=>x.viaje)).size,
    costo:tipo==='costos'?out.reduce((a,x)=>a+(x.costo_flete||0),0):null,unidades:tipo==='despachos'?out.reduce((a,x)=>a+(x.cant_despachada||0),0):null};
}

/* ============================ FILTROS UI ============================ */
function renderFilters(){
  const el=$('#filters');
  const chips=Object.entries(F.sets).filter(([,s])=>s.size).map(([id,s])=>{const D=DIMS[id];const names=[...s].slice(0,2).map(k=>D.cats[k]).join(', ')+(s.size>2?' +'+(s.size-2):'');return `<span class="chip" data-d="${id}"><span>${esc(D.label)}: ${esc(names)}</span><button aria-label="Quitar filtro ${esc(D.label)}" data-x="${id}">✕</button></span>`}).join('');
  const R=window.__OLO_RANGO||{min:DAYS[0],max:DAYS[DAYS.length-1]};   // en la web: todos los meses cargados
  const d0=DAYS[0],d1=DAYS[DAYS.length-1],fueraF=(F.from&&F.from>d1)||(F.to&&F.to<d0)||(F.from&&F.from<d0)||(F.to&&F.to>d1);
  const fdm=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
  el.innerHTML=`<div class="field"><label for="fd">Desde</label><input type="date" id="fd" min="${R.min}" max="${R.max}" value="${F.from}"></div>
   <div class="field"><label for="ft">Hasta</label><input type="date" id="ft" min="${R.min}" max="${R.max}" value="${F.to}"></div>
   ${fueraF?`<div class="field" role="status" style="max-width:300px;font-size:12px;color:var(--amber,#b45309);align-self:center">⚠ Parte del rango está fuera de los datos cargados (${fdm(d0)} a ${fdm(d1)}). Solo se muestran los días con despacho dentro de ese período.</div>`:''}
   <div class="field"><label>Buscar cliente, artículo o viaje</label><input type="text" id="fs" placeholder="Ej: ferretería, 9054164, 9062" value="${esc(F.search)}" style="width:260px"></div>
   <div class="field"><label>Agregar filtro</label><select id="fa"><option value="">+ Dimensión…</option>${DIM_ORDER.filter(d=>DIMS[d].filter).map(d=>`<option value="${d}">${esc(DIMS[d].label)}</option>`).join('')}</select></div>
   <div class="field"><label>BDF</label><button class="btn ghost" data-q="bdf" style="height:32px">${F.sets.bdf&&F.sets.bdf.size?F.sets.bdf.size+' seleccionados':'Todos'} ▾</button></div>
   <div class="field"><label>Grupo BDF</label><button class="btn ghost" data-q="bdfGrupo" style="height:32px">${F.sets.bdfGrupo&&F.sets.bdfGrupo.size?F.sets.bdfGrupo.size+' seleccionados':'Todos'} ▾</button></div>
   <div class="field"><label>Factor vol. (kg/m³)</label><input type="number" id="pv1" min="1" step="1" value="${PAR.fvol}" style="width:110px"></div>
   ${DAILY?`<div class="field"><label>Flota propia ₡ (mes, por día)</label><button class="btn ghost" id="pv2go" style="height:32px" title="Editar en la pestaña Flota propia">₡ ${fmtN(cpropMes(),0)} ▸</button></div>`:''}<div class="field" ${DAILY?'hidden':''}><label>Costo flota propia ₡ (mes)</label><input type="text" inputmode="numeric" id="pv2" value="${PAR.cprop?fmtN(PAR.cprop,0):''}" placeholder="Ingresar costo real" style="width:170px"></div>
   <div class="chips">${chips}</div>`;
  const parNum=s=>{s=String(s).replace(/[^\d,.]/g,'');
    if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');          // 12.000.000,50
    else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s))s=s.replace(/[.,]/g,''); // 12.000.000 / 12.000
    else s=s.replace(/,/g,'');                                                // 12,000,000 / 12000.5
    const n=parseFloat(s);return isFinite(n)?n:0};
  const savePar=()=>{if(window.__OLO_SAVE_PAR)window.__OLO_SAVE_PAR(PAR);try{localStorage.setItem(PAR_KEY,JSON.stringify(PAR))}catch(e){}computeCost();syncShared();renderFilters();renderView()};
  $('#pv1').onchange=e=>{const v=+e.target.value;if(v>0){PAR.fvol=v;savePar()}};
  $('#pv2').onchange=e=>{PAR.cprop=Math.max(0,parNum(e.target.value));savePar()};
  if($('#pv2go'))$('#pv2go').onclick=()=>{CUR='flota';renderTabs();renderView()};
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openPop(b.dataset.q,b));
  const setF=(k,v)=>{F[k]=v;
    if(F.from&&F.to&&F.from>F.to){if(k==='from')F.to='';else F.from=''}   // la otra fecha quedó inconsistente: se limpia
    if(window.__OLO_FECHAS&&window.__OLO_FECHAS(F.from,F.to))return;   // web: cambia de mes si el rango está en otro
    refresh()};
  $('#fd').onchange=e=>setF('from',e.target.value);$('#ft').onchange=e=>setF('to',e.target.value);
  let tm;$('#fs').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{F.search=e.target.value;applyFilters();renderView()},250)};
  $('#fa').onchange=e=>{if(e.target.value)openPop(e.target.value,e.target);e.target.value=''};
  el.querySelectorAll('.chip').forEach(c=>{c.querySelector('span').onclick=()=>openPop(c.dataset.d,c);c.querySelector('button').onclick=ev=>{ev.stopPropagation();delete F.sets[c.dataset.d];refresh()}});
}
function openPop(dimId,anchor){
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  const D=DIMS[dimId],sel=new Set(F.sets[dimId]||[]);
  // conteos con los demás filtros aplicados excepto este
  const saved=F.sets[dimId];delete F.sets[dimId];applyFilters();
  const cnt=new Map();for(let n=0;n<FILT.length;n++){const k=D.arr[FILT[n]];cnt.set(k,(cnt.get(k)||0)+1)}
  if(saved)F.sets[dimId]=saved;applyFilters();
  const pop=document.createElement('div');pop.className='pop';
  const r=anchor.getBoundingClientRect();pop.style.left=Math.min(r.left+scrollX,innerWidth-340)+'px';pop.style.top=(r.bottom+scrollY+4)+'px';
  pop.innerHTML=`<b>${esc(D.label)}</b><input type="text" placeholder="Buscar…" id="pq"><div class="list" id="pl"></div><div style="display:flex;gap:8px"><button class="btn sm" id="pa">Aplicar</button><button class="btn ghost sm" id="pn2">Ninguno</button><button class="btn ghost sm" id="pc2">Cerrar</button></div>`;
  document.body.appendChild(pop);
  const drawList=()=>{const q=$('#pq').value.toLowerCase();const items=D.order.filter(k=>cnt.has(k)||sel.has(k)).filter(k=>!q||D.cats[k].toLowerCase().includes(q)).slice(0,300);
    $('#pl').innerHTML=items.map(k=>`<label class="opt"><input type="checkbox" data-k="${k}" ${sel.has(k)?'checked':''}> <span>${esc(D.cats[k])}</span><span class="n">${fmtN(cnt.get(k)||0)}</span></label>`).join('')||'<div class="note">Sin opciones</div>';
    $('#pl').querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?sel.add(+i.dataset.k):sel.delete(+i.dataset.k)})};
  $('#pq').oninput=drawList;drawList();$('#pq').focus();
  $('#pa').onclick=()=>{if(sel.size)F.sets[dimId]=sel;else delete F.sets[dimId];pop.remove();refresh()};
  $('#pn2').onclick=()=>{sel.clear();drawList()};$('#pc2').onclick=()=>pop.remove();
}
document.addEventListener('mousedown',e=>{const p=$('.pop');if(p&&!p.contains(e.target)&&!e.target.closest('#filters'))p.remove()});

function renderTabs(){
  $('#tabs').innerHTML=VIEWS.map(v=>`<button role="tab" aria-selected="${v.id===CUR}" data-v="${v.id}">${esc(v.title)}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{CUR=b.dataset.v;history.replaceState(null,'','#'+CUR);renderTabs();renderView()});
}
function renderView(){const v=VIEWS.find(x=>x.id===CUR)||VIEWS[0];const h=$('#view');h.innerHTML='';v.render(h)}
function refresh(){applyFilters();renderFilters();renderView();if(typeof syncShared==='function')syncShared()}
/* ---- Compartir: genera un HTML completo y autocontenido ---- */
function shareState(){
  const sets={};Object.entries(F.sets).forEach(([id,st])=>{if(st.size)sets[id]=[...st].map(k=>DIMS[id].cats[k])});
  return {par:{fvol:PAR.fvol,cprop:PAR.cprop},filters:{from:F.from,to:F.to,search:F.search,sets},view:CUR,
    by:(SHARED&&SHARED.by)||('guardado '+new Date().toLocaleString('es-CR'))};
}
function syncShared(){try{document.getElementById('olo-shared').textContent=JSON.stringify({...shareState(),live:1})}catch(e){}}
function buildShare(){
  const sh={...shareState(),by:'compartido '+new Date().toLocaleString('es-CR')};
  const json=JSON.stringify(sh).replace(/</g,'\\u003c');
  return PRISTINE.replace(/(<script id="olo-shared" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
}
function shareNow(){
  const html=buildShare();const d=new Date();const pad=n=>String(n).padStart(2,'0');
  const name=`OLO-transporte-cofersa-oct2026_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.html`;
  const blob=new Blob([html],{type:'text/html'});
  const nf=Object.values(F.sets).filter(x=>x.size).length+(F.from||F.to?1:0)+(F.search?1:0);
  const file=typeof File==='function'?new File([blob],name,{type:'text/html'}):null;
  $('#mbody').innerHTML=`<h2 style="font-size:18px;color:var(--teal);margin-bottom:8px">Compartir tablero</h2>
   <p style="margin-bottom:10px">Se genera <b>un solo archivo HTML</b> (${fmtN(blob.size/1e6,1)} MB) con todos los datos, el logo y la lógica. Quien lo reciba solo tiene que abrirlo con doble clic en Chrome, Edge o Safari; no necesita internet ni instalar nada.</p>
   <div class="card kv" style="margin-bottom:12px"><div><b>Factor volumétrico</b>${fmtN(PAR.fvol)} kg/m³</div><div><b>Costo flota propia</b>₡ ${fmtN(PAR.cprop,0)}</div><div><b>Filtros incluidos</b>${nf?fmtN(nf)+' activos':'ninguno'}</div><div><b>Abre en la pestaña</b>${esc((VIEWS.find(v=>v.id===CUR)||{}).title||'')}</div></div>
   ${PAR.cprop>0?`<div class="note" style="color:var(--green);font-weight:600;margin-bottom:10px">✓ El costo de flota propia (₡ ${fmtN(PAR.cprop,0)}) va dentro del archivo: quien lo abra verá la misma distribución.</div>`:`<div class="warn">El costo de flota propia está en ₡ 0. Si lo compartes así, los destinatarios no verán costo de flota propia. Ingrésalo antes en la barra de filtros.</div>`}
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="shDl">Descargar archivo</button>${file&&navigator.canShare&&navigator.canShare({files:[file]})?'<button class="btn ghost" id="shSys">Enviar (correo, AirDrop, Teams…)</button>':''}</div>
   <p class="note" style="margin-top:10px">Para varias personas: envíalo por correo o súbelo a OneDrive, SharePoint o Google Drive y comparte el enlace (en Drive/SharePoint deben descargarlo y abrirlo; la vista previa web no ejecuta el tablero). Cada persona puede cambiar filtros y parámetros en su copia sin afectar a las demás.</p>`;
  $('#modal').classList.add('on');
  $('#shDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  const sb=$('#shSys');if(sb)sb.onclick=()=>navigator.share({files:[file],title:'Tablero transporte Cofersa',text:'Tablero de transporte Cofersa (octubre 2026). Abrir el archivo con doble clic.'}).catch(()=>{});
}
$('#btnShare').onclick=()=>window.__OLO_SHARE_WEB?window.__OLO_SHARE_WEB():shareNow();
$('#btnReset').onclick=()=>{F.from=F.to=F.search='';F.sets={};refresh()};
$('#btnTheme').onclick=()=>{const d=document.documentElement;const t=d.dataset.theme==='dark'?'':'dark';t?d.dataset.theme=t:d.removeAttribute('data-theme');try{localStorage.setItem('olo-theme',t)}catch(e){}};
try{if(localStorage.getItem('olo-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}

buildDims();buildCatMaps();
$('#foot').innerHTML=`${esc(META.compania)} · fuente ${esc(META.fuente)} · ${fmtN(META.lineas)} líneas · distancia = línea recta × ${META.factor} · generado ${esc(META.generado)}`;

/* API pública para ir agregando cosas */
window.OLO={
  data:DATA,dims:DIMS,metrics:METRICS,views:VIEWS,filters:F,
  addDim:(id,label,fn,opts)=>{addDim(id,label,fn,opts);buildCatMaps()},   // fn(i) -> categoría de la línea i
  addMetric,addView,groupBy,total,enrich,table,hbars,vbars,kpi,fmtN,openDetail,
  lineas:{N,KG,M3,KM,Q,L},buildShare:()=>buildShare(),refresh:()=>{renderTabs();refresh()}
};
const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v.id===h))CUR=h;
if(window.__OLO_F0){F.from=window.__OLO_F0.from||'';F.to=window.__OLO_F0.to||''}   // web: fechas que vienen en el enlace (?desde=&hasta=)
if(SHARED){try{const sf=SHARED.filters||{};F.from=sf.from||'';F.to=sf.to||'';F.search=sf.search||'';
  Object.entries(sf.sets||{}).forEach(([id,names])=>{const D=DIMS[id];if(!D)return;const st=new Set(names.map(n=>D.cats.indexOf(n)).filter(k=>k>=0));if(st.size)F.sets[id]=st});
  if(!h&&SHARED.view&&VIEWS.some(v=>v.id===SHARED.view))CUR=SHARED.view;computeCost();
  $('#foot').innerHTML+=' · copia '+esc(SHARED.by||'compartida');
  if(!SHARED.live){const b=document.createElement('div');b.className='warn';b.style.margin='10px 20px 0';
    b.innerHTML=`<b>Copia ${esc(SHARED.by||'compartida')}</b> · Incluye costo de flota propia <b>₡ ${fmtN(+(SHARED.par&&SHARED.par.cprop)||0,0)}</b> y factor volumétrico <b>${fmtN(+(SHARED.par&&SHARED.par.fvol)||333)} kg/m³</b>, con los filtros del autor. Puedes cambiarlos; tus cambios quedan solo en tu equipo.`;
    $('#tabs').before(b)}}catch(e){}}
renderTabs();refresh();
};
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous" defer></script>
<script>
(()=>{
'use strict';
const SB_URL='https://kxfdobayilzebljazkeb.supabase.co', SB_ANON='sb_publishable_kO4CoduONRhiaNlGCJResQ_yAZ-pxxZ';
const $=s=>document.querySelector(s);
const gate=$('#gate'),msg=$('#gateMsg'),err=$('#gErr'),btn=$('#gBtn');
if(!window.supabase||SB_URL.startsWith('__')){msg.textContent='Falta configurar la conexión a Supabase (URL y anon key).';btn.disabled=true;return}
const sb=supabase.createClient(SB_URL,SB_ANON,{db:{schema:'transporte'},auth:{persistSession:true,autoRefreshToken:true}});
let ROL='lector',MES=null,EMAIL='';
const busy=(t)=>{msg.textContent=t;btn.disabled=true};
const campos=v=>{$('#gFields').style.display=v?'flex':'none'};
const conSesion=(()=>{try{return Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k))}catch(e){return false}})();
if(conSesion){campos(false);msg.textContent='Cargando tablero…'}   // al recargar: no mostrar el login si ya hay sesión

async function boot(){
  let session=null;
  try{({data:{session}}=await sb.auth.getSession())}catch(e){}
  if(!session){campos(true);btn.disabled=false;msg.textContent=conSesion?'Tu sesión expiró. Ingresa de nuevo.':'Ingresa con tu correo y contraseña.';return}
  await cargar(session);
  if(document.getElementById('gate'))campos(true);   // si la carga falló, volver a mostrar el formulario
}
$('#gateF').onsubmit=async e=>{e.preventDefault();err.textContent='';busy('Validando…');
  const {data,error}=await sb.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value});
  if(error){err.textContent='No se pudo ingresar: '+(error.message==='Invalid login credentials'?'correo o contraseña incorrectos':error.message);btn.disabled=false;msg.textContent='Ingresa con tu correo y contraseña.';return}
  await cargar(data.session);
};

let CARGANDO=false;
async function cargar(session){
  if(CARGANDO)return;CARGANDO=true;   // evita doble carga (getSession y login pueden resolver juntos)
  EMAIL=session.user.email;busy('Cargando datos…');
  const u=await sb.from('usuarios_autorizados').select('rol').eq('email',EMAIL.toLowerCase()).maybeSingle();
  if(u.error||!u.data){CARGANDO=false;err.textContent='Tu correo ('+EMAIL+') no está autorizado. Pide acceso al administrador.';btn.disabled=false;await sb.auth.signOut();msg.textContent='Ingresa con tu correo y contraseña.';return}
  ROL=u.data.rol;
  const m=await sb.rpc('meses_disponibles');
  if(m.error||!m.data||!m.data.length){CARGANDO=false;err.textContent='No hay meses cargados todavía'+(m.error?': '+m.error.message:'');btn.disabled=false;return}
  const qs=new URLSearchParams(location.search),fecha=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:'';
  const desde=fecha(qs.get('desde')),hasta=fecha(qs.get('hasta'));
  const pedido=qs.get('mes')||(desde||hasta?(desde||hasta).slice(0,7)+'-01':null);
  MES=(m.data.find(x=>x.mes===pedido)||m.data[0]).mes;
  // filtro de fechas: el calendario abarca todos los meses cargados; si el rango cae en otro mes, se cambia de mes
  const MESES=new Set(m.data.map(x=>x.mes)),ult=s=>{const [y,mo]=s.split('-').map(Number);return s.slice(0,8)+String(new Date(y,mo,0).getDate()).padStart(2,'0')};
  const orden=[...MESES].sort();
  window.__OLO_RANGO={min:orden[0],max:ult(orden[orden.length-1])};
  window.__OLO_F0={from:desde,to:hasta};
  window.__OLO_FECHAS=(f,t)=>{
    const mf=f?f.slice(0,7)+'-01':'',mt=t?t.slice(0,7)+'-01':'';
    const destino=(mf&&mt&&mf!==mt)?(mf===MES||mt===MES?MES:mf):(mf||mt||MES);
    if(mf&&mt&&mf!==mt)aviso('El tablero trabaja por mes: se muestra solo la parte del rango que cae en '+destino.slice(0,7)+'. Para otro mes usa el selector Mes.','warn');
    const enlace=mes=>{const p=new URLSearchParams({mes});if(f)p.set('desde',f);if(t)p.set('hasta',t);return '?'+p.toString()};
    if(destino===MES||!MESES.has(destino)){
      if(destino!==MES)aviso('No hay datos cargados para '+destino.slice(0,7)+'.','warn');
      try{history.replaceState(null,'',enlace(MES)+location.hash)}catch(e){}   // al recargar se conservan las fechas
      return false}
    esperarGuardado().then(()=>{location.search=enlace(destino)});return true;
  };
  const r=await sb.rpc('tablero_mes',{p_mes:MES});
  if(r.error||!r.data||!r.data.lines||!r.data.lines.v){CARGANDO=false;err.textContent='Error al leer el mes '+MES+(r.error?': '+r.error.message:'');btn.disabled=false;return}
  const D=r.data,P=D.parametros||{};
  D.meta={generado:'Supabase '+MES,fuente:'Supabase · despachos WMS',compania:'Cofersa ('+(P.compania||'0109')+')',
    factor:+P.factor_ruta||1.35,minViaje:P.costo_min_viaje_propio!=null?+P.costo_min_viaje_propio:85000,origen:[+P.cd_lat,+P.cd_lon],lineas:D.lines.v.length,factorVol:+P.factor_vol_default||333,
    fuenteCosto:'Supabase · costos_rutas (Resumen de rutas)'};
  const fd=await sb.rpc('flota_dias_mes',{p_mes:MES});
  D.flotaDia=fd.error?[]:(fd.data||[]);
  window.__OLO_DATA=D;
  window.__OLO_API=api();
  window.__OLO_SAVE_PAR=guardarPar;
  window.__OLO_SHARE_WEB=compartir;
  gate.remove();
  window.__OLO_START();
  barra(m.data);
}

let tmr=null;
function guardarPar(par){   // el costo de flota propia se guarda por día en su pestaña; aquí solo el factor volumétrico del mes
  if(ROL!=='editor'){aviso('Solo usuarios editores guardan el factor volumétrico; tu cambio aplica solo en tu pantalla.','warn');return}
  clearTimeout(tmr);tmr=setTimeout(async()=>{
    const {error}=await sb.rpc('guardar_factor_vol',{p_mes:MES,p_factor_vol:par.fvol});
    aviso(error?'No se pudo guardar: '+error.message:'Guardado para todos: factor volumétrico '+par.fvol+' kg/m³ ('+MES.slice(0,7)+')',error?'err':'ok');
  },600);
}
const ok=r=>{if(r.error)throw new Error(r.error.message);return r.data};
function api(){return {
  rol:ROL,email:EMAIL,mes:MES,aviso,
  async guardarDias(list){ok(await sb.rpc('guardar_flota_dias',{p_dias:list}));return ok(await sb.rpc('flota_dias_mes',{p_mes:MES}))},
  async cargas(){return ok(await sb.rpc('ultimas_cargas',{p_n:40}))||[]},
  async pendientes(){return ok(await sb.from('v_pendientes').select('tipo,codigo,nombre,lineas').order('lineas',{ascending:false}).limit(200))||[]},
  async subir(tipo,r,prog){
    const d=new Date(),p2=n=>String(n).padStart(2,'0');
    const path=`${tipo}/${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}/${d.toISOString().replace(/[:.]/g,'-')}_${r.file.name.replace(/[^\w.\-]+/g,'_')}`;
    prog('Guardando archivo original…');
    const up=await sb.storage.from('transporte-entradas').upload(path,r.file,{upsert:false,contentType:r.file.type||'application/octet-stream'});
    if(up.error)throw new Error('Archivo original: '+up.error.message);
    const id=ok(await sb.rpc('iniciar_carga',{p_tipo:tipo,p_archivo:r.file.name,p_storage:path}));
    try{
      if(tipo==='costos'){prog('Cargando costos…');return ok(await sb.rpc('cargar_costos',{p_carga:id,p_filas:r.rows}))}
      const CH=4000;
      for(let i=0;i<r.rows.length;i+=CH){prog(`Enviando filas ${Math.min(i+CH,r.rows.length).toLocaleString('es-CR')} de ${r.rows.length.toLocaleString('es-CR')}…`);
        ok(await sb.rpc('agregar_despachos',{p_carga:id,p_filas:r.rows.slice(i,i+CH)}))}
      prog('Reemplazando días en la base…');
      return ok(await sb.rpc('finalizar_carga_despachos',{p_carga:id}));
    }catch(e){await sb.rpc('cancelar_carga',{p_carga:id,p_detalle:e.message});throw e}
  }}}
function aviso(t,k){let el=$('#sbToast');if(!el){el=document.createElement('div');el.id='sbToast';el.setAttribute('role','status');
  el.style.cssText='position:fixed;right:16px;bottom:16px;z-index:90;max-width:420px;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)';document.body.appendChild(el)}
  el.style.background=k==='err'?'var(--red-soft)':k==='warn'?'var(--amber-soft)':'var(--teal-soft)';el.style.color='var(--text)';el.textContent=t;
  clearTimeout(el._t);el._t=setTimeout(()=>el.remove(),6000)}
function compartir(){const F=(window.OLO&&window.OLO.filters)||{},p=new URLSearchParams({mes:MES});if(F.from)p.set('desde',F.from);if(F.to)p.set('hasta',F.to);
  const u=location.origin+location.pathname+'?'+p.toString();
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>aviso('Enlace copiado: '+u+' · Cada persona entra con su usuario.','ok'))
   .catch(()=>prompt('Copia este enlace:',u))}
// antes de cambiar de mes o salir: terminar de guardar el costo de flota propia (máx. 8 s)
async function esperarGuardado(){
  if(!(window.__OLO_PEND&&window.__OLO_PEND()))return;
  aviso('Guardando el costo de flota propia antes de cambiar…','warn');
  for(let i=0;i<40&&window.__OLO_PEND();i++)await new Promise(r=>setTimeout(r,200));
}
function barra(meses){
  const h=document.querySelector('header .sp');
  const box=document.createElement('div');box.style.cssText='display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2)';
  box.innerHTML='<label for="sbMes">Mes</label><select id="sbMes">'+meses.map(x=>'<option value="'+x.mes+'"'+(x.mes===MES?' selected':'')+'>'+x.mes.slice(0,7)+' · '+new Intl.NumberFormat('es-CR').format(x.lineas)+' líneas</option>').join('')+
    '</select><span title="'+EMAIL+'">'+EMAIL.split('@')[0]+' · '+ROL+'</span><button class="btn ghost sm" id="sbOut">Salir</button>';
  h.after(box);
  $('#sbMes').onchange=async e=>{const v=e.target.value;await esperarGuardado();location.search='?mes='+v};
  $('#sbOut').onclick=async()=>{await esperarGuardado();await sb.auth.signOut();location.reload()};
}
boot();
})();
</script>
